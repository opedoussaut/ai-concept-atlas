<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"
  role="img" aria-label="A major update to the AI Concept Atlas: a complete French edition, the Dojo, and the Workshop. 87 AI concepts, 38 mathematical foundations, 261 links between them. Free, with no account and no tracking.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#050b14"/><stop offset="1" stop-color="#03070d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.16" r="0.5">
      <stop offset="0" stop-color="#1a66b4" stop-opacity=".26"/><stop offset="1" stop-color="#1a66b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.72" r="0.42">
      <stop offset="0" stop-color="#7f47c0" stop-opacity=".2"/><stop offset="1" stop-color="#7f47c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="rgba(113,177,233,.13)" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.2" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1080" height="1350" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1080" height="1350" fill="url(#glowA)"/>
  <rect width="1080" height="1350" fill="url(#glowB)"/>

  <rect x="72" y="80" width="228" height="46" rx="12" fill="rgba(93,231,255,.12)" stroke="rgba(93,231,255,.45)"/>
  <text x="186" y="110" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="21" font-weight="bold" letter-spacing="3.2"
        fill="#5de7ff" text-anchor="middle">NEW UPDATE</text>

  <text x="72" y="234" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="86" font-weight="bold" fill="#f4f8ff">Learn it. Test it.</text>
  <text x="72" y="332" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="86" font-weight="bold" fill="#b58cff">Then go and build.</text>

  <text x="72" y="404" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="27" fill="#a9b8ca">Three new sections in the AI Concept Atlas.</text>
  <text x="72" y="446" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="27" fill="#a9b8ca">Free. No account, no cookies, no tracking.</text>

  
  <g>
    <rect x="72" y="524" width="936" height="132" rx="18" fill="rgba(255,255,255,.028)" stroke="rgba(157,210,255,.17)"/>
    <rect x="72" y="524" width="4" height="132" rx="2" fill="#5de7ff"/>
    <g>
      <rect x="112" y="560" width="84" height="60" rx="14" fill="rgba(93,231,255,.1)" stroke="rgba(93,231,255,.4)"/>
      <text x="154" y="600" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#5de7ff" text-anchor="middle">FR</text>
    </g>
    <text x="232" y="580" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="34" font-weight="bold" fill="#f4f8ff">A complete French edition</text>
    <text x="232" y="620" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" fill="#a9b8ca">All 125 concepts. Add ?lang=fr to any link.</text>
  </g>

  
  <g>
    <rect x="72" y="676" width="936" height="132" rx="18" fill="rgba(255,255,255,.028)" stroke="rgba(157,210,255,.17)"/>
    <rect x="72" y="676" width="4" height="132" rx="2" fill="#ffc978"/>
    <g>
      <g transform="translate(112 698) scale(0.9545454545454546)">
