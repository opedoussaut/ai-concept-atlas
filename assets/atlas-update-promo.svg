    <path d="M49 21 L52 29 L45 26 Z" fill="#eceff1" stroke="rgba(0,0,0,.25)" stroke-width=".5"/>
  </g>
      <g transform="translate(112 724) scale(0.9545454545454546)">
    <rect x="2" y="9" width="84" height="9" rx="1.5" fill="#7b4b2a" stroke="rgba(255,255,255,.28)" stroke-width=".8"/>
    <rect x="34" y="5" width="20" height="16" rx="2" fill="#7b4b2a" stroke="rgba(255,255,255,.32)" stroke-width=".8"/>
    <path d="M39 21 L36 29 L43 26 Z" fill="#7b4b2a" stroke="rgba(0,0,0,.25)" stroke-width=".5"/>
    <path d="M49 21 L52 29 L45 26 Z" fill="#7b4b2a" stroke="rgba(0,0,0,.25)" stroke-width=".5"/>
  </g>
      <g transform="translate(112 750) scale(0.9545454545454546)">
    <rect x="2" y="9" width="84" height="9" rx="1.5" fill="#15181c" stroke="rgba(255,255,255,.28)" stroke-width=".8"/>
    <rect x="34" y="5" width="20" height="16" rx="2" fill="#15181c" stroke="rgba(255,255,255,.32)" stroke-width=".8"/>
    <path d="M39 21 L36 29 L43 26 Z" fill="#15181c" stroke="rgba(0,0,0,.25)" stroke-width=".5"/>
    <path d="M49 21 L52 29 L45 26 Z" fill="#15181c" stroke="rgba(0,0,0,.25)" stroke-width=".5"/>
  </g>
    </g>
    <text x="232" y="732" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="34" font-weight="bold" fill="#f4f8ff">The Dojo</text>
    <text x="232" y="772" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" fill="#a9b8ca">A quiz built from the atlas, graded as a judo belt.</text>
  </g>

  
  <g>
    <rect x="72" y="828" width="936" height="132" rx="18" fill="rgba(255,255,255,.028)" stroke="rgba(157,210,255,.17)"/>
    <rect x="72" y="828" width="4" height="132" rx="2" fill="#b58cff"/>
    <g><rect x="112" y="856" width="64" height="8" rx="4" fill="#5de7ff" opacity=".85"/><rect x="112" y="869" width="70" height="8" rx="4" fill="#6ea8ff" opacity=".85"/><rect x="112" y="882" width="64" height="8" rx="4" fill="#b58cff" opacity=".85"/><rect x="112" y="895" width="82" height="8" rx="4" fill="#6ce6af" opacity=".85"/><rect x="112" y="908" width="70" height="8" rx="4" fill="#ffc978" opacity=".85"/><rect x="112" y="921" width="70" height="8" rx="4" fill="#ff9e7d" opacity=".85"/></g>
    <text x="232" y="884" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="34" font-weight="bold" fill="#f4f8ff">The Workshop</text>
    <text x="232" y="924" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" fill="#a9b8ca">36 places worth knowing, sorted by the question you have.</text>
  </g>

  <line x1="72" y1="1008" x2="1008" y2="1008" stroke="rgba(157,210,255,.17)"/>
  
  <g>
    <text x="228" y="1116" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="56" font-weight="bold" fill="#5de7ff" text-anchor="middle">87</text>
    <text x="228" y="1154" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="21" fill="#a9b8ca" text-anchor="middle">AI concepts</text>
  </g>
  
  <g>
    <text x="540" y="1116" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="56" font-weight="bold" fill="#5de7ff" text-anchor="middle">38</text>
    <text x="540" y="1154" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="21" fill="#a9b8ca" text-anchor="middle">mathematical foundations</text>
  </g>
  
  <g>
    <text x="852" y="1116" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="56" font-weight="bold" fill="#5de7ff" text-anchor="middle">261</text>
    <text x="852" y="1154" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="21" fill="#a9b8ca" text-anchor="middle">links between them</text>
  </g>

  <text x="540" y="1248" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#f4f8ff" text-anchor="middle">opedoussaut.github.io/ai-concept-atlas</text>
  <text x="540" y="1294" font-family="Noto Serif CJK JP, serif" font-size="22" fill="#ffc978" text-anchor="middle" opacity=".8">道場 · L’Atelier · The Workshop</text>
